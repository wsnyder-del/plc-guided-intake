<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLC Guided Intake</title>
<style>
  :root{
    --navy:#1B2A4A; --gold:#B8912A; --lightgold:#F6EFDD; --cream:#FAF7F0;
    --gray:#555; --red:#8B2323; --green:#2d5a2d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:Arial,Helvetica,sans-serif; background:#f2f0eb; color:#222; line-height:1.45;}
  .wrap{max-width:760px; margin:0 auto; padding:16px;}
  header{background:var(--navy); color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;}
  header .brand{font-weight:bold; letter-spacing:.5px;}
  header .brand span{color:var(--gold);}
  .langbtn{background:var(--gold); color:var(--navy); border:none; padding:8px 14px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:14px;}
  .progress{height:6px; background:#ddd;}
  .progress div{height:100%; background:var(--gold); transition:width .3s;}
  .stage{font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--gold); font-weight:bold; margin:18px 0 6px;}
  .fu-tag{display:inline-block; background:var(--navy); color:var(--gold); font-size:10px; letter-spacing:1px; padding:2px 8px; border-radius:10px; margin-left:8px; vertical-align:middle;}
  .qcard{background:#fff; border:1px solid #d8d4ca; border-radius:8px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .qtext{font-size:19px; font-weight:bold; color:var(--navy); margin-bottom:6px;}
  .say{background:var(--cream); border-left:4px solid var(--gold); padding:10px 12px; margin:10px 0; font-family:Georgia,serif; font-style:italic; color:var(--navy); font-size:16px;}
  .saylabel{font-family:Arial; font-style:normal; font-weight:bold; font-size:11px; color:var(--gold); letter-spacing:1px; display:block; margin-bottom:4px;}
  .hint{font-size:13px; color:var(--gray); margin:6px 0 10px;}
  .opts{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
  .opts button{background:#fff; border:2px solid var(--navy); color:var(--navy); padding:12px 14px; border-radius:6px; font-size:16px; cursor:pointer; text-align:left; transition:background .15s;}
  .opts button:hover{background:var(--lightgold);}
  .opts button.selected{background:var(--navy); color:#fff;}
  textarea{width:100%; border:1px solid #bbb; border-radius:6px; padding:10px; font-size:15px; font-family:Arial; margin-top:10px; min-height:64px;}
  .navrow{display:flex; justify-content:space-between; gap:10px; margin:16px 0 40px;}
  .navrow button{padding:12px 22px; border-radius:6px; font-size:16px; font-weight:bold; cursor:pointer; border:none;}
  .backbtn{background:#ddd; color:#333;}
  .nextbtn{background:var(--gold); color:var(--navy);}
  .nextbtn:disabled{opacity:.4; cursor:not-allowed;}
  .flagbar{position:sticky; top:0; z-index:10; display:none; background:var(--red); color:#fff; padding:12px 16px; font-weight:bold; font-size:15px; border-radius:0 0 8px 8px;}
  .flagbar.show{display:block;}
  .flagbar small{display:block; font-weight:normal; font-size:13px; margin-top:3px;}
  .pill{display:inline-block; background:var(--lightgold); color:var(--navy); border:1px solid var(--gold); border-radius:20px; padding:3px 10px; font-size:12px; margin:2px;}
  .summary h2{color:var(--navy); border-bottom:3px solid var(--gold); padding-bottom:6px; margin:22px 0 10px; font-size:20px;}
  .sumitem{margin-bottom:10px; font-size:15px;}
  .sumitem b{color:var(--navy);}
  .escbox{background:var(--lightgold); border:2px solid var(--red); border-radius:8px; padding:14px; margin:14px 0;}
  .escbox h3{color:var(--red); font-size:16px; margin-bottom:8px;}
  .okbox{background:#eef4ee; border:2px solid var(--green); border-radius:8px; padding:14px; margin:14px 0; color:var(--green); font-weight:bold;}
  .verdict{padding:18px; border-radius:8px; margin:14px 0; font-size:20px; font-weight:bold;}
  .verdict.green{background:#eef4ee; border:3px solid var(--green); color:var(--green);}
  .verdict.red{background:#fbeeee; border:3px solid var(--red); color:var(--red);}
  .verdict .vsay{font-weight:normal; font-size:15px; color:#333; margin-top:10px; font-family:Georgia,serif; font-style:italic; background:rgba(255,255,255,.6); padding:10px; border-radius:6px;}
  .verdict .vnote{font-weight:normal; font-size:13px; color:#555; margin-top:8px;}
  .copybtn{background:var(--navy); color:#fff; border:none; padding:12px 20px; border-radius:6px; font-size:16px; font-weight:bold; cursor:pointer; margin:10px 6px 10px 0;}
  .submitbtn{background:var(--green); color:#fff; border:none; padding:12px 20px; border-radius:6px; font-size:16px; font-weight:bold; cursor:pointer; margin:10px 6px 10px 0;}
  .restart{background:#ddd; color:#333; border:none; padding:12px 20px; border-radius:6px; font-size:16px; cursor:pointer;}
  .startcard{background:#fff; border:1px solid #d8d4ca; border-radius:8px; padding:22px; margin-top:20px;}
  .startcard h1{color:var(--navy); font-size:22px; margin-bottom:10px;}
  .startcard p{margin-bottom:10px; font-size:15px;}
  .golden{background:var(--lightgold); border-left:4px solid var(--gold); padding:10px 12px; margin:12px 0; font-size:14px;}
  input[type=text]{width:100%; border:1px solid #bbb; border-radius:6px; padding:10px; font-size:16px; margin-top:8px;}
  .dtrow{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;}
  .dtrow input[type=date], .dtrow input[type=time]{flex:1; min-width:140px; border:1px solid #bbb; border-radius:6px; padding:10px; font-size:16px;}
  @media(max-width:480px){ .qtext{font-size:17px;} }
</style>
</head>
<body>

<header>
  <div class="brand">PIONEER LEGAL <span>CONSULTING</span> — Guided Intake</div>
  <button class="langbtn" id="langToggle" onclick="toggleLang()">Español</button>
</header>
<div class="progress"><div id="pbar" style="width:0%"></div></div>
<div class="flagbar" id="flagbar"></div>

<div class="wrap" id="app"></div>

<script>
/* =========================================================
   PLC Guided Intake v2 — adaptive if/then engine, EN/ES
   Answers push follow-up questions onto a queue; already-
   answered questions are skipped. Data stays in the browser.
   ========================================================= */

let LANG = 'en';
const T = (en, es) => LANG === 'en' ? en : es;

const UI = {
  say:      ['SAY','DIGA'],
  next:     ['Next','Siguiente'],
  back:     ['Back','Atrás'],
  notes:    ['Notes (optional)','Notas (opcional)'],
  start:    ['Start Intake','Comenzar Admisión'],
  followup: ['Follow-up','Seguimiento'],
  escalate: ['STOP — CALL OR TEXT WAYNE NOW: 313-635-3709','ALTO — LLAME O ENVÍE TEXTO A WAYNE AHORA: 313-635-3709'],
  escSub:   ['Deadlines or rights may be at risk. Call first, then finish the intake.','Puede haber plazos o derechos en riesgo. Llame primero, luego termine la admisión.'],
  summary:  ['Intake Summary','Resumen de Admisión'],
  redflags: ['Red flags noted','Señales de alerta detectadas'],
  escTitle: ['ESCALATIONS — Wayne must be contacted TODAY','ESCALACIONES — Contactar a Wayne HOY'],
  noEsc:    ['No escalation triggers. Proceed with normal review submission.','Sin escalaciones. Proceda con el envío normal para revisión.'],
  copy:     ['Copy Summary','Copiar Resumen'],
  submit:   ['Submit to Case Workspace','Enviar al Expediente del Caso'],
  copied:   ['Copied! Paste into the case workspace.','¡Copiado! Péguelo en el expediente del caso.'],
  restart:  ['New Intake','Nueva Admisión'],
  clientName: ['Client name','Nombre del cliente'],
  repName:  ['Rep name','Nombre del representante'],
  contactTitle: ['Contact Information','Información de Contacto'],
  contactSub: ['So we can actually reach them — especially important for follow-up leads.','Para poder contactarlos realmente — especialmente importante para leads de seguimiento.'],
  phone:    ['Phone number','Número de teléfono'],
  address:  ['Address','Dirección'],
  email:    ['Email','Correo electrónico'],
  contactOptional: ['Fill in what you have — none of these are required to continue.','Complete lo que tenga — ninguno es obligatorio para continuar.'],
  skipped:  ['(not answered)','(sin responder)'],
};

/* ---------- FLOW ----------
   Spine nodes advance via goto. Any option may carry:
     flag:[en,es]  esc:[en,es]  cat:'lied'|'adv'|'dmg'|'perf'
     fu:['nodeId',...]  -> follow-ups queued next (skipped if answered)
   Follow-up nodes have fu:true and no goto — when the queue
   empties, the engine resumes the spine where it left off.
---------------------------------- */
const FLOW = [

  /* ===== SPINE — STAGE 1: THE STORY ===== */
  {
    id:'narrative', stage:['1 · Their Story','1 · Su Historia'],
    q:['Open the story. Then be quiet and listen 2–3 minutes.','Abra el relato. Luego guarde silencio y escuche 2–3 minutos.'],
    say:[ '“Just tell me about your experience. I know it\u2019s been a while, but let\u2019s start at the very beginning.”',
          '“Cuénteme su experiencia. Sé que ya pasó tiempo, pero empecemos desde el principio.”'],
    hint:['Silence is a tool — clients fill it with facts. Notes are optional.','El silencio es una herramienta — los clientes lo llenan con hechos. Las notas son opcionales.'],
    type:'notes', goto:'howStarted'
  },
  {
    id:'howStarted', stage:['1 · Their Story','1 · Su Historia'],
    q:['How did the sale start?','¿Cómo empezó la venta?'],
    say:[ '“Did they knock on your door, or had an appointment been set? How did that first contact happen?”',
          '“¿Tocaron a su puerta, o ya había una cita programada? ¿Cómo fue ese primer contacto?”'],
    opts:[
      {label:['Door knock','Tocaron a la puerta'], flag:['Door-to-door sale','Venta puerta a puerta'], fu:['fuDoorTiming'], goto:'signing'},
      {label:['Phone call / telemarketing','Llamada / telemercadeo'], fu:['fuRemoteSale'], goto:'signing'},
      {label:['Appointment was set','Cita programada'], goto:'signing'},
      {label:['Referral / event / other','Referido / evento / otro'], goto:'signing'},
    ]
  },
  {
    id:'fuDoorTiming', fu:true, stage:['1 · Their Story','1 · Su Historia'],
    q:['How soon after that knock did they sign?','¿Qué tan pronto después de esa visita firmaron?'],
    opts:[
      {label:['Same visit / same day','La misma visita / el mismo día'], flag:['Same-day close after door knock','Cierre el mismo día tras visita a la puerta'], cat:'adv'},
      {label:['Within a few days','En unos pocos días'],},
      {label:['Weeks or more later','Semanas o más después'],},
      {label:['Doesn\u2019t remember','No recuerda'],},
    ]
  },
  {
    id:'fuRemoteSale', fu:true, stage:['1 · Their Story','1 · Su Historia'],
    q:['Where was the salesperson — local, or remote / out of state?','¿Dónde estaba el vendedor — local, o remoto / fuera del estado?'],
    opts:[
      {label:['Remote / out of state — never saw the house','Remoto / fuera del estado — nunca vio la casa'], flag:['Remote phone sale — system sold sight unseen','Venta telefónica remota — sistema vendido sin ver la casa'],},
      {label:['Local','Local'],},
      {label:['Doesn\u2019t know','No sabe'],},
    ]
  },
  {
    id:'signing', stage:['1 · Their Story','1 · Su Historia'],
    q:['How did the signing happen? (check all that apply)','¿Cómo fue la firma? (marque todo lo que aplique)'],
    say:[ '“Who signed, and where — on their tablet, at your kitchen table? Were you shown the pages?”',
          '“¿Quién firmó, y dónde — en la tableta de ellos, en la mesa de su cocina? ¿Le mostraron las páginas?”'],
    multi:true,
    opts:[
      {label:['Rushed on a tablet / pages not shown','Apurado en tableta / sin mostrar páginas'], value:'rushed', flag:['Rushed e-sign, pages not shown','Firma electrónica apurada, páginas no mostradas'], cat:'adv', fu:['fuCopies']},
      {label:['Signed same day as first contact','Firmó el mismo día del primer contacto'], value:'sameday', flag:['Same-day close','Cierre el mismo día'], cat:'adv'},
      {label:['Doesn\u2019t remember signing / blank docs','No recuerda firmar / documentos en blanco'], value:'blank', flag:['Possible signature irregularity','Posible irregularidad de firma'], cat:'adv', fu:['fuWhoseDevice','fuCopies']},
      {label:['Normal signing, had time to review','Firma normal, tuvo tiempo de revisar'], value:'none'},
    ],
    goto:'signerCheck'
  },
  {
    id:'fuCopies', fu:true, stage:['1 · Their Story','1 · Su Historia'],
    q:['Did they ever receive copies of what was signed?','¿Alguna vez recibieron copias de lo que se firmó?'],
    opts:[
      {label:['Emailed copies','Copias por correo electrónico'],},
      {label:['Paper copies','Copias en papel'],},
      {label:['Never received anything','Nunca recibieron nada'], flag:['Never received signed copies','Nunca recibieron copias firmadas'], cat:'adv'},
      {label:['Not sure','No está seguro'],},
    ]
  },
  {
    id:'fuWhoseDevice', fu:true, stage:['1 · Their Story','1 · Su Historia'],
    q:['Whose device was it signed on? Did they ever see a confirmation in their own email?','¿En qué dispositivo se firmó? ¿Vieron alguna confirmación en su propio correo?'],
    opts:[
      {label:['Salesperson\u2019s device, no email confirmation seen','Dispositivo del vendedor, sin confirmación por correo'], flag:['Signed on salesperson\u2019s device — no confirmation to client','Firmado en el dispositivo del vendedor — sin confirmación al cliente'], cat:'adv'},
      {label:['Client\u2019s own device / email confirmed','Dispositivo del cliente / correo confirmado'],},
      {label:['Doesn\u2019t remember','No recuerda'],},
    ]
  },
  {
    id:'signerCheck', stage:['1 · Their Story','1 · Su Historia'],
    q:['Everyone on the paperwork — present and accounted for?','¿Todos los que firmaron — presentes y localizables?'],
    hint:['Ask naturally: “Was anyone else on the loan? Are they available?”','Pregunte con naturalidad: “¿Alguien más está en el préstamo? ¿Está disponible?”'],
    opts:[
      {label:['Client is the only signer','El cliente es el único firmante'], goto:'lender'},
      {label:['Co-signer available','Co-firmante disponible'], goto:'lender'},
      {label:['A signer has passed away','Un firmante ha fallecido'], esc:['A signer on the documents is deceased','Un firmante en los documentos ha fallecido'], fu:['fuEstate'], goto:'lender'},
      {label:['Signer on docs was never present / unknown','Firmante en documentos nunca estuvo presente / desconocido'], flag:['Signer missing from signing — possible forgery','Firmante ausente en la firma — posible falsificación'], cat:'adv', goto:'lender'},
    ]
  },
  {
    id:'fuEstate', fu:true, stage:['1 · Their Story','1 · Su Historia'],
    q:['Is there an estate, executor, or surviving spouse handling their affairs?','¿Hay una sucesión, albacea o cónyuge sobreviviente manejando sus asuntos?'],
    hint:['Just note who — Wayne handles the rest.','Solo anote quién — Wayne maneja el resto.'],
    type:'notes'
  },

  {
    id:'lender', stage:['1 · Their Story','1 · Su Historia'],
    q:['Who is the lender?','¿Quién es el prestamista?'],
    hint:['If they don\u2019t know: it\u2019s on the monthly statement or autopay. The lender can email the loan contract while they\u2019re on the phone — useful later.','Si no saben: está en el estado de cuenta mensual o el pago automático. El prestamista puede enviar el contrato por correo mientras están en el teléfono — útil después.'],
    hint2:['Installer and lender are often in different states from the client — that\u2019s normal and can put the deal under federal jurisdiction, which can work in the client\u2019s favor. Note all three states if you catch them.','El instalador y el prestamista suelen estar en estados distintos al del cliente — es normal y puede poner el contrato bajo jurisdicción federal, lo cual favorece al cliente. Anote los tres estados si los identifica.'],
    opts:[
      {label:['GoodLeap','GoodLeap'], goto:'financeType'},
      {label:['Sunlight Financial','Sunlight Financial'], goto:'financeType'},
      {label:['Mosaic','Mosaic'], goto:'financeType'},
      {label:['EverBright','EverBright'], goto:'financeType'},
      {label:['Dividend / Fifth Third','Dividend / Fifth Third'], goto:'financeType'},
      {label:['Service Finance','Service Finance'], goto:'financeType'},
      {label:['Sunnova','Sunnova'], goto:'financeType'},
      {label:['Other / doesn\u2019t know yet','Otro / no sabe todavía'], goto:'financeType'},
    ]
  },
  {
    id:'financeType', stage:['1 · Their Story','1 · Su Historia'],
    q:['Loan, lease, or PPA (power purchase agreement)?','¿Préstamo, arrendamiento (lease), o acuerdo de compra de energía (PPA)?'],
    hint:['If they don\u2019t know: leases/PPAs usually mean a fixed or escalating monthly payment for the power itself, no ownership. A loan means they own the system and are paying it off.','Si no saben: los leases/PPA generalmente significan un pago mensual fijo o creciente por la energía misma, sin ser dueños. Un préstamo significa que son dueños del sistema y lo están pagando.'],
    opts:[
      {label:['Loan (they own the system)','Préstamo (son dueños del sistema)'], goto:'loanAge'},
      {label:['Lease','Arrendamiento (lease)'], goto:'promises'},
      {label:['PPA (power purchase agreement)','PPA (acuerdo de compra de energía)'], goto:'promises'},
      {label:['Not sure','No está seguro'], goto:'promises'},
    ]
  },
  {
    id:'loanAge', stage:['1 · Their Story','1 · Su Historia'],
    q:['About how long ago did they sign?','¿Hace cuánto tiempo firmaron aproximadamente?'],
    opts:[
      {label:['Less than 3 years ago','Hace menos de 3 años'], fu:['fuExtendedProtections'], goto:'promises'},
      {label:['3 years or more ago','Hace 3 años o más'], goto:'promises'},
      {label:['Not sure','No está seguro'], goto:'promises'},
    ]
  },
  {
    id:'fuExtendedProtections', fu:true, stage:['1 · Their Story','1 · Su Historia'],
    q:['Loans under 3 years old — the one specific thing you can say','Préstamos de menos de 3 años — lo único específico que puede decir'],
    say:[ '“With loans that are less than 3 years old, we sometimes find some additional protections that are available. It\u2019s case by case, and it\u2019s determined if it\u2019s the best path by the legal team once you\u2019re a client and they review everything and go through any follow-up information they need.”',
          '“Con préstamos de menos de 3 años, a veces encontramos protecciones adicionales disponibles. Es caso por caso, y lo determina el equipo legal si es el mejor camino una vez que sea cliente y revisen todo, incluyendo cualquier información de seguimiento que necesiten.”'],
    hint:['This is the ONLY loan-age-specific line reps use. Do not name TILA, rescission, or any statute — the legal team determines applicability, not the rep.','Esta es la ÚNICA línea específica sobre antigüedad del préstamo que usan los representantes. No mencione TILA, rescisión, ni ningún estatuto — el equipo legal determina la aplicabilidad, no el representante.'],
    opts:[ {label:['Said it — continue','Dicho — continuar'],} ]
  },
  /* ===== SPINE — STAGE 2: PROMISES vs REALITY ===== */
  {
    id:'promises', stage:['2 · Promise vs. Reality','2 · Promesa vs. Realidad'],
    q:['What was promised?','¿Qué le prometieron?'],
    say:[ '“How did they present the system — the production, what it would do to your electric bill? What made it feel like a good investment?”',
          '“¿Cómo le presentaron el sistema — la producción, lo que haría con su factura de luz? ¿Qué lo hizo sentir que era una buena inversión?”'],
    hint:['Note the key promises. If exact wording matters later, we can get a declaration.','Anote las promesas clave. Si el texto exacto importa después, podemos obtener una declaración.'],
    type:'notes', goto:'billReality'
  },
  {
    id:'billReality', stage:['2 · Promise vs. Reality','2 · Promesa vs. Realidad'],
    q:['What did the bills actually do?','¿Qué pasó en realidad con las facturas?'],
    say:[ '“So you were expecting [their words]. What did the first few bills actually look like?”',
          '“Entonces usted esperaba [sus palabras]. ¿Cómo se vieron en realidad las primeras facturas?”'],
    hint:['Buyback rates can be pennies — and utilities can slash them AFTER install. Fixed connection fees (~$25–50/mo) survive every \u201Cno bill\u201D promise. Bills tell the story; push for them.','Las tarifas de recompra pueden ser centavos — y las compañías pueden recortarlas DESPUÉS de instalar. Las cuotas fijas de conexión (~$25–50/mes) sobreviven a toda promesa de \u201Csin factura.\u201D Las facturas cuentan la historia; insístalas.'],
    opts:[
      {label:['Paying loan AND full electric bill','Paga el préstamo Y la factura completa'], flag:['Double payment — loan + full utility bill','Pago doble — préstamo + factura completa'], cat:'lied', fu:['fuOffsetPromise'], goto:'taxCredit'},
      {label:['Bill dropped some, less than promised','La factura bajó algo, menos de lo prometido'], flag:['Savings shortfall vs. promise','Ahorro menor a lo prometido'], cat:'lied', fu:['fuOffsetPromise'], goto:'taxCredit'},
      {label:['Bill dropped as promised','La factura bajó como prometieron'], goto:'taxCredit'},
      {label:['Not sure / hasn\u2019t compared','No sabe / no ha comparado'], goto:'taxCredit'},
    ]
  },
  {
    id:'fuOffsetPromise', fu:true, stage:['2 · Promise vs. Reality','2 · Promesa vs. Realidad'],
    q:['What offset were they told? “No bill”? A percentage?','¿Qué compensación les dijeron? ¿“Sin factura”? ¿Un porcentaje?'],
    opts:[
      {label:['“No electric bill” / 100%','“Sin factura de luz” / 100%'], flag:['Promised full bill elimination','Prometieron eliminar la factura por completo'], cat:'lied', fu:['fuProposalDoc']},
      {label:['A specific percentage or dollar figure','Un porcentaje o cifra específica'], flag:['Specific savings figure promised','Cifra específica de ahorro prometida'], cat:'lied', fu:['fuProposalDoc']},
      {label:['Vague — “big savings”','Vago — “grandes ahorros”'], fu:['fuProposalDoc']},
      {label:['Doesn\u2019t remember','No recuerda'],},
    ]
  },
  {
    id:'fuProposalDoc', fu:true, stage:['2 · Promise vs. Reality','2 · Promesa vs. Realidad'],
    q:['Was that shown on a proposal, tablet, or paper? Do they still have it?','¿Se lo mostraron en una propuesta, tableta o papel? ¿Todavía lo tienen?'],
    opts:[
      {label:['Yes — still have it','Sí — todavía lo tienen'], flag:['Savings promise in writing — client has it','Promesa de ahorro por escrito — el cliente la tiene'], fu:['fuItemization']},
      {label:['Shown, but doesn\u2019t have it','Se lo mostraron, pero no lo tienen'], fu:['fuItemization']},
      {label:['Nothing was ever shown','Nunca le mostraron nada'], fu:['fuItemization']},
    ]
  },
  {
    id:'fuItemization', fu:true, stage:['2 · Promise vs. Reality','2 · Promesa vs. Realidad'],
    q:['Was the total broken down — panels, hardware, install, fees — or just one lump number?','¿El total se desglosó — paneles, hardware, instalación, cargos — o fue solo una cifra única?'],
    hint:['No itemized breakdown of the loan total is extremely common and significant — note it even if the client isn\u2019t sure.','La falta de un desglose del monto total del préstamo es muy común y significativa — anótelo aunque el cliente no esté seguro.'],
    opts:[
      {label:['Lump sum only — no breakdown','Solo una cifra — sin desglose'], flag:['No itemized cost breakdown provided','No se proporcionó desglose de costos'], cat:'adv'},
      {label:['Some breakdown was given','Se dio algún desglose'],},
      {label:['Not sure','No está seguro'],},
    ]
  },
  {
    id:'taxCredit', stage:['2 · Promise vs. Reality','2 · Promesa vs. Realidad'],

let answers = {};

let escs = [];
let cats = new Set();
let history = [];   // snapshots {current, queue, spineNext}
let queue = [];     // pending follow-up node ids
let spineNext = null;
let current = 'start';
let meta = {client:'', rep:'', mode:'intake', phone:'', address:'', email:''};

const $ = id => document.getElementById(id);
const app = $('app');

function toggleLang(){
  LANG = LANG === 'en' ? 'es' : 'en';
  $('langToggle').textContent = LANG === 'en' ? 'Español' : 'English';
  render();
}

function node(id){ return FLOW.find(n=>n.id===id); }

function updateFlagbar(){
  const bar = $('flagbar');
  if (escs.length){
    bar.className = 'flagbar show';
    bar.innerHTML = '⚠ ' + T(UI.escalate[0],UI.escalate[1]) +
      '<small>' + T(UI.escSub[0],UI.escSub[1]) + ' — ' +
      escs.map(e=>T(e[0],e[1])).join(' · ') + '</small>';
  } else {
    bar.className = 'flagbar';
  }
}

function progressPct(){
  if (current==='start') return 0;
  if (current==='summary') return 100;
  const isR = n => n.id.startsWith('r') && n.id[1] === n.id[1].toUpperCase();
  const spine = FLOW.filter(n=>!n.fu && (meta.mode==='retention' ? isR(n) : !isR(n)));
  const answered = spine.filter(n=>answers[n.id]).length;
  return Math.min(97, Math.round((answered/Math.max(1,spine.length))*100));
}

function render(){
  $('pbar').style.width = progressPct()+'%';
  updateFlagbar();
  if (current==='start') return renderStart();
  if (current==='contact') return renderContact();
  if (current==='summary') return renderSummary();
  renderQuestion(node(current));
}

      <div class="navrow"><span></span><span></span></div>
      <div class="opts">
        <button onclick="startIntake('intake')">▶ ${T('Start Intake Call','Comenzar Llamada de Admisión')}</button>
        <button onclick="startIntake('retention')">▶ ${T('Start Retention / Payment Call','Comenzar Llamada de Retención / Pago')}</button>
      </div>
    </div>`;
}

function startIntake(mode){
  meta.client = $('clientName').value.trim();
  meta.rep = $('repName').value.trim();
  meta.mode = mode || 'intake';
  history = []; queue = []; spineNext = null;
  current = 'contact';
  saveState();
  render();
}

function renderContact(){
  app.innerHTML = `
    <div class="startcard">
      <h1>${T(UI.contactTitle[0],UI.contactTitle[1])}</h1>
      <p>${T(UI.contactSub[0],UI.contactSub[1])}</p>
      <label>${T(UI.phone[0],UI.phone[1])}</label>
      <input type="tel" id="clientPhone" value="${meta.phone}" placeholder="(555) 555-5555">
      <label style="display:block;margin-top:10px">${T(UI.address[0],UI.address[1])}</label>
      <input type="text" id="clientAddress" value="${meta.address}" placeholder="${T('Street, City, State','Calle, Ciudad, Estado')}">
      <label style="display:block;margin-top:10px">${T(UI.email[0],UI.email[1])}</label>
      <input type="email" id="clientEmail" value="${meta.email}" placeholder="name@example.com">
      <div class="hint" style="margin-top:10px">${T(UI.contactOptional[0],UI.contactOptional[1])}</div>
      <div class="navrow">
        <button class="backbtn" onclick="backToStart()">${T(UI.back[0],UI.back[1])}</button>
        <button class="nextbtn" onclick="continueToFlow()">${T(UI.next[0],UI.next[1])}</button>
      </div>
    </div>`;
}

function backToStart(){
  meta.phone = ($('clientPhone')||{}).value || meta.phone;
  meta.address = ($('clientAddress')||{}).value || meta.address;
  meta.email = ($('clientEmail')||{}).value || meta.email;
  current = 'start';
  render();
}

function continueToFlow(){
  meta.phone = $('clientPhone').value.trim();
  meta.address = $('clientAddress').value.trim();
  meta.email = $('clientEmail').value.trim();
  current = meta.mode === 'retention' ? 'rOpen' : FLOW[0].id;
  saveState();
  render();
}

function renderQuestion(n){
  const a = answers[n.id] || {};
  let html = `<div class="stage">${T(n.stage[0],n.stage[1])}${n.fu?`<span class="fu-tag">${T(UI.followup[0],UI.followup[1])}</span>`:''}</div><div class="qcard">`;
  html += `<div class="qtext">${T(n.q[0],n.q[1])}</div>`;
  if (n.say) html += `<div class="say"><span class="saylabel">${T(UI.say[0],UI.say[1])}</span>${T(n.say[0],n.say[1])}</div>`;
  if (n.hint) html += `<div class="hint">→ ${T(n.hint[0],n.hint[1])}</div>`;
  if (n.hint2) html += `<div class="hint">→ ${T(n.hint2[0],n.hint2[1])}</div>`;

  if (n.opts){
    html += `<div class="opts">`;
    n.opts.forEach((o,i)=>{
      const sel = n.multi ? (a.values||[]).includes(o.value) : a.optIndex===i;
      html += `<button class="${sel?'selected':''}" onclick="pick('${n.id}',${i})">${T(o.label[0],o.label[1])}</button>`;
    });
    html += `</div>`;
  }
  if (n.type==='datetime'){
    html += `<div class="dtrow">
      <input type="date" id="fuDate" value="${a.date||''}">
      <input type="time" id="fuTime" value="${a.time||''}">
    </div>`;
  }
  const notesLabel = n.notesLabel ? T(n.notesLabel[0],n.notesLabel[1]) : T(UI.notes[0],UI.notes[1]);
  html += `<textarea id="notes" placeholder="${notesLabel}">${a.notes||''}</textarea>`;
  html += `</div>`;
  const canNext = n.type==='notes' || n.multi || a.optIndex!==undefined || (n.type==='datetime' && a.date && a.time);
  html += `<div class="navrow">
    <button class="backbtn" onclick="goBack()">${T(UI.back[0],UI.back[1])}</button>
    <button class="nextbtn" id="nextBtn" ${canNext?'':'disabled'} onclick="goNext()">${T(UI.next[0],UI.next[1])}</button>
  </div>`;
  app.innerHTML = html;
  const ta = $('notes');
  if (ta) ta.addEventListener('input', ()=>{ collectNotes(current); saveState(); });
  const dEl = $('fuDate'), tEl = $('fuTime');
  if (dEl) dEl.addEventListener('change', ()=>{ collectDateTime(current); saveState(); renderQuestion(node(current)); });
  if (tEl) tEl.addEventListener('change', ()=>{ collectDateTime(current); saveState(); renderQuestion(node(current)); });
  window.scrollTo(0,0);
}

function pick(id, i){
  const n = node(id);
  const o = n.opts[i];
  answers[id] = answers[id] || {};
  const a = answers[id];
  a.notes = $('notes') ? $('notes').value : (a.notes||'');
  if (n.multi){
    a.values = a.values || [];
    if (o.value==='none'){ a.values = a.values.includes('none') ? [] : ['none']; }
    else {
      a.values = a.values.filter(v=>v!=='none');
      a.values.includes(o.value) ? a.values = a.values.filter(v=>v!==o.value) : a.values.push(o.value);
    }
  } else {
    a.optIndex = i;
    a.goto = o.goto;
  }
  saveState();
  renderQuestion(n);
}

function collectNotes(id){
  const el = $('notes');
  if (el){ answers[id] = answers[id] || {}; answers[id].notes = el.value; }
}

function collectDateTime(id){
  const d = $('fuDate'), t = $('fuTime');
  if (d || t){
    answers[id] = answers[id] || {};
    if (d) answers[id].date = d.value;
    if (t) answers[id].time = t.value;
  }
}

function selectedOpts(id){
  const n = node(id); if (!n || !n.opts) return [];
  const a = answers[id] || {};
  return n.multi
    ? (a.values||[]).map(v=>n.opts.find(o=>o.value===v)).filter(Boolean)
    : (a.optIndex!==undefined ? [n.opts[a.optIndex]] : []);
}

function recomputeSignals(){
  flags = []; escs = []; cats = new Set();
  for (const id in answers){
    selectedOpts(id).forEach(o=>{
      if (o.flag) flags.push(o.flag);
      if (o.esc) escs.push(o.esc);
      if (o.cat) cats.add(o.cat);
    });
  }
}

/* ---------- the if/then engine ---------- */
function goNext(){
  const n = node(current);
  collectNotes(current);
  collectDateTime(current);
  recomputeSignals();
  history.push({current, queue:[...queue], spineNext});

  // gather follow-ups from every selected option, in order,
  // skipping anything already answered or already queued
  const fus = [];
  selectedOpts(current).forEach(o=>{
    (o.fu||[]).forEach(f=>{
      if (!answers[f] && !queue.includes(f) && !fus.includes(f) && f!==current) fus.push(f);
    });
  });
  queue = [...fus, ...queue];   // new follow-ups run first (chains nest)

  // remember where the spine resumes
  if (!n.fu){
    const a = answers[current] || {};
    spineNext = (!n.multi && a.goto) ? a.goto : (n.goto || 'summary');
  }

  // next question: queue first (skip any answered), then spine
  let next = null;
  while (queue.length && !next){
    const cand = queue.shift();
    if (!answers[cand]) next = cand;
  }
  current = next || spineNext || 'summary';
  saveState();
  render();
}

function goBack(){
  if (!history.length){ current='start'; return render(); }
  collectNotes(current);
  collectDateTime(current);
  const snap = history.pop();
  current = snap.current; queue = snap.queue; spineNext = snap.spineNext;
  recomputeSignals();
  saveState();
  render();
}

/* ---------- summary + verdict ---------- */
function renderSummary(){
  recomputeSignals();
  const date = new Date().toLocaleString();
  const isRet = meta.mode === 'retention';
  let html = `<div class="summary"><h2>${isRet ? T('Retention Call Summary','Resumen de Llamada de Retención') : T(UI.summary[0],UI.summary[1])}</h2>`;
  html += `<div class="sumitem"><b>${T('Client','Cliente')}:</b> ${meta.client||T(UI.skipped[0],UI.skipped[1])} &nbsp; <b>${T('Rep','Representante')}:</b> ${meta.rep||T(UI.skipped[0],UI.skipped[1])} &nbsp; <b>${T('Date','Fecha')}:</b> ${date}</div>`;
  if (meta.phone || meta.address || meta.email){
    const parts = [];
    if (meta.phone) parts.push(`📞 ${meta.phone}`);
    if (meta.email) parts.push(`✉️ ${meta.email}`);
    if (meta.address) parts.push(`📍 ${meta.address}`);
    html += `<div class="sumitem">${parts.join(' &nbsp; ')}</div>`;
  }

  if (!isRet){
    const repAns = answers['representingStatus'];
    const repIdx = repAns && repAns.optIndex;
    if (repIdx !== undefined){
      const repVal = node('representingStatus').opts[repIdx].value;
      const folderLabel = repVal === 'representing'
        ? T('→ FILES TO: SOLD','→ SE ARCHIVA EN: VENDIDO')
        : T('→ FILES TO: UNSOLD (follow-up leads)','→ SE ARCHIVA EN: NO VENDIDO (leads de seguimiento)');
      const folderColor = repVal === 'representing' ? 'okbox' : 'escbox';
      html += `<div class="${folderColor}" style="padding:10px 14px; font-size:14px;">${folderLabel}</div>`;
    }
    const fuDt = answers['followUpDateTime'];
    if (fuDt && fuDt.date){
      const dtLabel = T('📅 Follow-up call scheduled: ','📅 Llamada de seguimiento programada: ') + fuDt.date + (fuDt.time ? ' ' + fuDt.time : '');
      html += `<div class="okbox" style="padding:10px 14px; font-size:14px;">${dtLabel}</div>`;
    }
  }

  if (isRet){
    // no case verdict on retention calls
  } else if (cats.size > 0){
    html += `<div class="verdict green">\u2713 ${T('GOOD CASE TO TAKE — the patterns here match situations we work with.','BUEN CASO PARA TOMAR — los patrones coinciden con situaciones en las que trabajamos.')}
      <div class="vsay">${T('“Everything you\u2019ve described mirrors what we\u2019ve seen in many clients — the promises versus the reality, and how the deal was put together. There are real, identifiable patterns here, and situations like yours are exactly why consumer protection laws exist. Everything goes to our review team for a careful, individual look, and the specific path is determined after that review. You\u2019ll hear from us by [day].”',
      '“Todo lo que ha descrito refleja lo que hemos visto en muchos clientes — las promesas frente a la realidad, y cómo se armó el trato. Hay patrones reales e identificables aquí, y situaciones como la suya son exactamente la razón por la que existen las leyes de protección al consumidor. Todo va a nuestro equipo de revisión para un análisis cuidadoso e individual, y el camino específico se determina después de esa revisión. Tendrá noticias nuestras el [día].”')}</div>
      <div class="vnote">${T('Still no promises: no “entitled to,” no “guaranteed,” no outcomes. The review team makes the final determination.','Sin promesas: nada de “tiene derecho a,” “garantizado,” ni resultados. El equipo de revisión hace la determinación final.')}</div></div>`;
  } else {
    html += `<div class="verdict red">\u2715 ${T('NO CLEAR TRIGGERS — this doesn\u2019t show the patterns we typically work with.','SIN DETONANTES CLAROS — no muestra los patrones con los que normalmente trabajamos.')}
      <div class="vsay">${T('“I appreciate you walking me through everything. I\u2019m going to pass this to our review team for a careful look — every situation is different, and they make the determination either way. You\u2019ll hear from us by [day].”',
      '“Le agradezco que me haya contado todo. Voy a pasar esto a nuestro equipo de revisión para un análisis cuidadoso — cada situación es distinta, y ellos hacen la determinación en cualquier caso. Tendrá noticias nuestras el [día].”')}</div>
      <div class="vnote">${T('Don\u2019t decline for them — submit with a note. The review team makes the final call.','No lo rechace usted — envíelo con una nota. El equipo de revisión toma la decisión final.')}</div></div>`;
  }

  if (escs.length){
    html += `<div class="escbox"><h3>⚠ ${T(UI.escTitle[0],UI.escTitle[1])}</h3>`;
    escs.forEach(e=> html += `<div class="sumitem">• ${T(e[0],e[1])}</div>`);
    html += `<div class="sumitem"><b>313-635-3709</b></div></div>`;
  } else {
    html += `<div class="okbox">✓ ${T(UI.noEsc[0],UI.noEsc[1])}</div>`;
  }

  html += `<h2>${T(UI.redflags[0],UI.redflags[1])} (${flags.length})</h2>`;
  flags.length
    ? flags.forEach(f=> html += `<span class="pill">${T(f[0],f[1])}</span>`)
    : html += `<div class="sumitem">${T('None recorded.','Ninguna registrada.')}</div>`;

  html += `<h2>${T('Answers & Notes','Respuestas y Notas')}</h2>`;
  FLOW.forEach(n=>{
    const a = answers[n.id]; if (!a) return;
    let val = '';
    if (n.multi && a.values) {
      val = a.values.map(v=>{
        const o = n.opts.find(x=>x.value===v);
        return o ? T(o.label[0],o.label[1]) : v;
      }).join(', ');
    } else if (a.optIndex!==undefined && n.opts) val = T(n.opts[a.optIndex].label[0], n.opts[a.optIndex].label[1]);
    else if (n.type==='datetime' && a.date) val = a.date + (a.time ? ' ' + a.time : '');
    html += `<div class="sumitem"><b>${T(n.q[0],n.q[1])}</b><br>${val||''}${a.notes?'<br><i>'+esc_(a.notes)+'</i>':''}</div>`;
  });

  html += `<button class="copybtn" onclick="copySummary()">${T(UI.copy[0],UI.copy[1])}</button>
           <button class="submitbtn" id="submitBtn" onclick="submitToBackend()">${T(UI.submit[0],UI.submit[1])}</button>
           <button class="restart" onclick="restart()">${T(UI.restart[0],UI.restart[1])}</button>
           <div id="copiedMsg" class="hint"></div>
           <div id="submitMsg" class="hint"></div></div>`;
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function esc_(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* ---------- submit to Apps Script backend (Sheet log + escalation email) ----------
   Paste your deployed Apps Script Web App URL below. Leave blank and the button
   will just tell the rep to copy/paste manually instead of silently failing. */
const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbxnhv9VIvDoQuBGIVdu4VUnB9HtHfn5iybM9eRUxK5dTR2cZKMwG39rkfqCm0s3MK2A/exec';

function submitToBackend(){
  const msgEl = $('submitMsg');
  if (!WEBHOOK_URL){
    msgEl.textContent = T('Backend not connected yet — use Copy Summary for now.','El backend aún no está conectado — use Copiar Resumen por ahora.');
    return;
  }
  const repValueRaw = answers['representingStatus'] || {};
  const representing = repValueRaw.optIndex!==undefined ? node('representingStatus').opts[repValueRaw.optIndex].value : '';
  const fuReasonNode = answers['followUpReason'] || {};
  const followUpReasonVal = fuReasonNode.optIndex!==undefined
    ? node('followUpReason').opts[fuReasonNode.optIndex].label[0]
    : '';
  const fuSchedNode = answers['followUpSchedule'] || {};
  const followUpScheduled = fuSchedNode.optIndex!==undefined
    ? node('followUpSchedule').opts[fuSchedNode.optIndex].value === 'yes'
    : false;
  const fuDateTimeNode = answers['followUpDateTime'] || {};
  const payload = {
    client: meta.client, rep: meta.rep, lang: LANG,
    clientPhone: meta.phone || '', clientAddress: meta.address || '', clientEmail: meta.email || '',
    verdict: cats.size>0 ? 'GREEN' : 'RED',
    representing: representing,                    // 'representing' | 'not_representing' | ''
    followUpReason: followUpReasonVal,
    followUpNotes: fuReasonNode.notes || '',
    followUpScheduled: followUpScheduled,
    followUpDate: fuDateTimeNode.date || '',
    followUpTime: fuDateTimeNode.time || '',
    followUpCallNotes: fuDateTimeNode.notes || '',
    escalations: escs, flags: flags,
    lender: (answers['lender']||{}).labelEn || '',
    financeType: (answers['financeType']||{}).labelEn || '',
    answers: answers,
  };
  msgEl.textContent = T('Submitting...','Enviando...');
  const form = new URLSearchParams();
  form.set('payload', JSON.stringify(payload));
  fetch(WEBHOOK_URL, { method:'POST', body: form })
    .then(r => r.json())
    .then(result => {
      if (result && result.ok) {
        let msg = T('Submitted to case workspace.','Enviado al expediente del caso.');
        if (result.sheetError) msg += ' ' + T('(Sheet log failed, but filing + email went through — check with Wayne.)','(El registro en la hoja falló, pero el archivo y el correo sí se enviaron — avise a Wayne.)');
        msgEl.textContent = msg;
        msgEl.style.color = '';
      } else {
        msgEl.textContent = T('Backend error — ','Error del sistema — ') + (result && result.error ? result.error : T('unknown. Use Copy Summary instead and let Wayne know.','desconocido. Use Copiar Resumen y avise a Wayne.'));
        msgEl.style.color = '#8B2323';
      }
    })
    .catch(()=>{
      msgEl.textContent = T('Couldn\u2019t reach the backend — use Copy Summary instead.','No se pudo conectar — use Copiar Resumen en su lugar.');
      msgEl.style.color = '#8B2323';
    });
}

function copySummary(){
  const date = new Date().toLocaleString();
  let out = `PLC GUIDED INTAKE SUMMARY\nClient: ${meta.client}\nPhone: ${meta.phone||''}\nEmail: ${meta.email||''}\nAddress: ${meta.address||''}\nRep: ${meta.rep}\nDate: ${date}\n\n`;
  if (meta.mode === 'retention'){
    out += `TYPE: RETENTION / PAYMENT CALL\n\n`;
  } else {
    out += cats.size>0
      ? `VERDICT: GREEN — patterns match situations we work with (review team confirms)\n\n`
      : `VERDICT: RED — no clear triggers; submitted for review with note\n\n`;
  }
  out += escs.length
    ? `*** ESCALATIONS — CONTACT WAYNE TODAY (313-635-3709) ***\n${escs.map(e=>'- '+e[0]).join('\n')}\n\n`
    : `No escalation triggers.\n\n`;
  out += `RED FLAGS (${flags.length}):\n${flags.map(f=>'- '+f[0]).join('\n')||'- none'}\n\nANSWERS:\n`;
  FLOW.forEach(n=>{
    const a = answers[n.id]; if (!a) return;
    let val = '';
    if (n.multi && a.values) val = a.values.map(v=>{const o=n.opts.find(x=>x.value===v);return o?o.label[0]:v;}).join(', ');
    else if (a.optIndex!==undefined && n.opts) val = n.opts[a.optIndex].label[0];
    else if (n.type==='datetime' && a.date) val = a.date + (a.time ? ' ' + a.time : '');
    out += `\n${n.q[0]}\n  ${val}${a.notes?'\n  NOTES: '+a.notes:''}\n`;
  });
  navigator.clipboard.writeText(out).then(()=>{ $('copiedMsg').textContent = T(UI.copied[0],UI.copied[1]); });
}

function restart(){
  answers={}; flags=[]; escs=[]; cats=new Set(); history=[]; queue=[]; spineNext=null;
  current='start'; meta={client:'',rep:'',mode:'intake',phone:'',address:'',email:''};
  try{ localStorage.removeItem('plcIntake'); }catch(e){}
  render();
}

/* ---------- autosave ---------- */
function saveState(){
  try{
    localStorage.setItem('plcIntake', JSON.stringify({answers, history, queue, spineNext, current, meta, LANG, ts:Date.now()}));
  }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem('plcIntake');
    if(!raw) return;
    const st = JSON.parse(raw);
    if(Date.now()-st.ts > 12*60*60*1000) return;
    if(st.current && st.current!=='start'){
      answers = st.answers||{}; history = st.history||[]; queue = st.queue||[];
      spineNext = st.spineNext||null; current = st.current;
      meta = Object.assign({}, meta, st.meta||{}); LANG = st.LANG||LANG;
      document.getElementById('langToggle').textContent = LANG==='en' ? 'Español' : 'English';
    }
  }catch(e){}
}

loadState();
render();
</script>
